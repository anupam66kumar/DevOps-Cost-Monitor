apiVersion: 1

datasources:
  - name: PostgreSQL-CostMonitor
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: postgrespassword
    jsonData:
      database: costmonitor
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
    isDefault: true
    editable: true
